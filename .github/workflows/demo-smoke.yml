name: Demo Smoke Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [security-hardening]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse application JavaScript
        run: node --check js/app.js
      - name: Verify demo isolation and safeguards
        run: node scripts/smoke-check.mjs
